<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Raio-X — Espião CZ</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    /* ── Layout do header com dois selects ── */
    .rx-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .rx-title {
      font-size: 1.3em;
      font-weight: 700;
      color: var(--navy);
      flex: 1;
      min-width: 140px;
    }
    #fundo-select-wrap { display: none; } /* oculto até dados carregarem */
    #fundo-select {
      font-family: var(--font);
      font-size: 0.88em;
      font-weight: 600;
      color: var(--navy);
      background: var(--bg2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      cursor: pointer;
      outline: none;
      min-width: 160px;
      max-width: 260px;
    }
    #fundo-select:focus { border-color: var(--accent); }

    /* ── Legenda do gráfico ── */
    .chart-legend {
      display: flex;
      gap: 16px;
      margin-bottom: 8px;
      font-size: 0.8em;
      color: var(--text2);
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot  { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }

    /* ── Container do gráfico ── */
    .chart-wrap {
      background: var(--bg2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 12px 12px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      overflow-x: auto;
    }

    /* ── Grid entradas / saídas ── */
    .es-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    .es-col {
      background: var(--bg2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }
    .es-lista { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
    .es-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.84em;
      padding: 3px 0;
      border-bottom: 1px solid var(--border);
    }
    .es-item:last-child { border-bottom: none; }
    .es-codigo { font-family: var(--mono); font-size: 0.92em; }

    /* ── Destaques + tabela ── */
    #destaques   { margin-bottom: 20px; }
    #tabela-posicoes { margin-bottom: 8px; }

    @media (max-width: 600px) {
      .es-grid { grid-template-columns: 1fr; }
      #fundo-select { max-width: 100%; }
    }
  </style>
</head>
<body>

<div id="nav"></div>

<div class="page-wrap">
<div class="container">

  <!-- ── Cabeçalho ── -->
  <div class="rx-header">
    <div class="rx-title">Raio-X por Fundo</div>
    <div id="mes-container">
      <select class="mes-select" disabled><option>Carregando…</option></select>
    </div>
    <div id="fundo-select-wrap">
      <select id="fundo-select" aria-label="Selecionar fundo"></select>
    </div>
  </div>

  <!-- ── Conteúdo principal (loading inicial) ── -->
  <div id="main-content">
    <div class="ui-loading">Carregando posições…</div>
  </div>

</div>
</div>

<!-- Vega-Lite via CDN -->
<script src="https://cdn.jsdelivr.net/npm/vega@5/build/vega.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5/build/vega-lite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6/build/vega-embed.min.js"></script>

<script src="js/util.js"></script>
<script src="js/raio_x.js"></script>
</body>
</html>
